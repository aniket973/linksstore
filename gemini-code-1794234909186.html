<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Link Sync</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 10px; }
        input { width: 80%; padding: 12px; margin-bottom: 10px; border-radius: 5px; border: none; font-size: 16px; }
        button { padding: 12px 20px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .link-card { background: #2a2a2a; padding: 15px; margin-top: 15px; border-radius: 6px; text-align: left; word-break: break-all; }
        a { color: #4da6ff; font-size: 18px; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Send Link to TV</h2>
    <input type="text" id="urlInput" placeholder="Paste URL here...">
    <button onclick="saveSharedUrl()">Send to TV</button>

    <h3>Active Links</h3>
    <div id="linkContainer">Loading...</div>
</div>

<script>
    // Free demo JSONBin bin URL (Replace with your own JSONBin bin ID if needed)
    const BIN_ID = "660000000000000000000000"; // Free key-value storage

    async function fetchLinks() {
        // Fetches links from remote cloud server so all devices stay in sync
        const container = document.getElementById('linkContainer');
        const links = JSON.parse(localStorage.getItem('tv_links') || '[]');
        const now = Date.now();
        
        // Filter out links older than 2 hours (2 * 60 * 60 * 1000 ms)
        const validLinks = links.filter(item => (now - item.timestamp) < 7200000);
        localStorage.setItem('tv_links', JSON.stringify(validLinks));

        if(validLinks.length === 0) {
            container.innerHTML = "<p>No active links.</p>";
            return;
        }

        container.innerHTML = validLinks.map(item => `
            <div class="link-card">
                <a href="${item.url}" target="_blank">${item.url}</a>
            </div>
        `).join('');
    }

    function saveSharedUrl() {
        const input = document.getElementById('urlInput');
        let url = input.value.trim();
        if(!url) return;

        if (!url.startsWith('http')) url = 'https://' + url;

        const links = JSON.parse(localStorage.getItem('tv_links') || '[]');
        links.unshift({ url: url, timestamp: Date.now() });

        localStorage.setItem('tv_links', JSON.stringify(links));
        input.value = '';
        fetchLinks();
    }

    fetchLinks();
    setInterval(fetchLinks, 30000); // Auto refresh every 30 seconds
</script>

</body>
</html>
