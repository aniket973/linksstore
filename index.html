<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Temp Link Saver</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            text-align: center; 
            padding: 40px 20px; 
            margin: 0;
        }

        .container { 
            max-width: 520px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 16px; 
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4); 
            text-align: left;
        }

        h2 { margin-top: 0; font-size: 24px; font-weight: 700; color: #fff; text-align: center; }
        .subtitle { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 25px; }

        .form-group { margin-bottom: 15px; }
        
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 14px 16px; 
            background: #0f172a; 
            border: 1px solid var(--card-border); 
            border-radius: 8px; 
            color: white; 
            font-size: 15px; 
            box-sizing: border-box; 
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--accent-blue);
        }

        .row { display: flex; gap: 12px; margin-bottom: 15px; align-items: center; }
        .row input { margin-bottom: 0; }

        .checkbox-label { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 14px; 
            color: var(--text-muted); 
            cursor: pointer; 
            white-space: nowrap; 
            user-select: none;
        }
        .checkbox-label input { width: 16px; height: 16px; accent-color: var(--accent-amber); cursor: pointer; }

        button.primary-btn { 
            width: 100%;
            padding: 14px; 
            background: var(--accent-blue); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 600;
            cursor: pointer; 
            transition: background 0.2s, transform 0.1s;
        }
        button.primary-btn:hover { background: var(--accent-blue-hover); }
        button.primary-btn:active { transform: scale(0.99); }

        .section-title { font-size: 16px; font-weight: 600; margin: 30px 0 15px 0; color: var(--text-muted); border-bottom: 1px solid var(--card-border); padding-bottom: 8px; }

        .link-card { 
            background: #0f172a; 
            padding: 14px 16px; 
            margin-bottom: 12px; 
            border-radius: 10px; 
            border: 1px solid var(--card-border);
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 12px;
            transition: border-color 0.2s;
        }
        .link-card.pinned { 
            border-color: rgba(245, 158, 11, 0.4); 
            background: linear-gradient(to right, rgba(245, 158, 11, 0.05), #0f172a);
        }

        .link-info { overflow: hidden; flex-grow: 1; }
        
        a.link-url { color: #60a5fa; font-size: 14px; text-decoration: none; word-break: break-all; display: block; margin-bottom: 4px; }
        a.link-url:hover { text-decoration: underline; }
        a.locked-url { color: #f87171 !important; font-weight: 500; cursor: pointer; }

        .badges { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
        .badge.locked { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge.pinned { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.3); }

        .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
        .timer { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

        .action-btns { display: flex; gap: 6px; }
        
        .icon-btn { 
            background: #1e293b; 
            border: 1px solid var(--card-border); 
            border-radius: 6px; 
            padding: 6px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: background 0.2s, border-color 0.2s;
        }
        .icon-btn svg { width: 14px; height: 14px; fill: var(--text-muted); transition: fill 0.2s; }
        
        .icon-btn.pin-btn:hover { background: rgba(245, 158, 11, 0.15); border-color: var(--accent-amber); }
        .icon-btn.pin-btn:hover svg { fill: var(--accent-amber); }
        .icon-btn.pin-btn.active svg { fill: var(--accent-amber); }
        .icon-btn.pin-btn.active { background: rgba(245, 158, 11, 0.15); border-color: var(--accent-amber); }

        .icon-btn.delete-btn:hover { background: rgba(239, 68, 68, 0.15); border-color: var(--danger); }
        .icon-btn.delete-btn:hover svg { fill: var(--danger); }

        .empty-state { text-align: center; color: var(--text-muted); font-size: 14px; padding: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Cloud Temp Link Saver</h2>
    <p class="subtitle">Seamlessly sync links across your PC, Phone, and TV</p>
    
    <div class="form-group">
        <input type="text" id="urlInput" placeholder="Paste URL here (e.g. youtube.com/... )">
    </div>
    
    <div class="row">
        <input type="password" id="pinInput" maxlength="3" placeholder="3-Digit PIN (Optional)">
        <label class="checkbox-label">
            <input type="checkbox" id="pinCheck"> Pin to top
        </label>
    </div>
    
    <button class="primary-btn" onclick="saveLink()">Save Link</button>

    <div class="section-title">Active Links</div>
    <div id="linkContainer" class="empty-state">Loading links from cloud...</div>
</div>

<script>
    // 👇 REPLACE THESE TWO LINES WITH YOUR ACTUAL JSONBIN DETAILS 👇
    const BIN_ID = "6af1e202ffd5d16053b3d3dd"; 
    const MASTER_KEY = "$2a$10$An56rqGvzb6DWwrnvIRiAOddYLcFCLpp83vI0DBHqoSMu.sPm2h9.";
    // -------------------------------------------------------------

    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
    const EXPIRATION_TIME = 2 * 60 * 60 * 1000; // 2 hours in milliseconds

    // SVG Icons Definitions
    const pinSvg = `<svg viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>`;
    const trashSvg = `<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;

    async function fetchLinks() {
        try {
            let response = await fetch(API_URL, {
                headers: { "X-Master-Key": MASTER_KEY }
            });
            let data = await response.json();
            let links = data.record.links || [];

            const now = Date.now();
            let activeLinks = links.filter(item => item.pinned || (now - item.timestamp) < EXPIRATION_TIME);
            activeLinks.sort((a, b) => (b.pinned === true) - (a.pinned === true) || b.timestamp - a.timestamp);

            const container = document.getElementById('linkContainer');
            if (activeLinks.length === 0) {
                container.innerHTML = "No active links found.";
                return;
            }

            container.innerHTML = activeLinks.map((item, index) => {
                const timeLeft = Math.ceil((EXPIRATION_TIME - (now - item.timestamp)) / (60 * 1000));
                
                let linkDisplay = '';
                if (item.pin) {
                    linkDisplay = `<a class="link-url locked-url" onclick="accessLockedLink('${item.url}')">🔒 [Protected Link]</a>`;
                } else {
                    linkDisplay = `<a class="link-url" href="${item.url}" target="_blank">${item.url}</a>`;
                }

                return `
                    <div class="link-card ${item.pinned ? 'pinned' : ''}">
                        <div class="link-info">
                            ${linkDisplay}
                            <div class="badges">
                                ${item.pin ? '<span class="badge locked">PIN Protected</span>' : ''}
                                ${item.pinned ? '<span class="badge pinned">Pinned</span>' : ''}
                            </div>
                        </div>
                        <div class="meta">
                            <div class="action-btns">
                                <button class="icon-btn pin-btn ${item.pinned ? 'active' : ''}" onclick="togglePin(${index})" title="${item.pinned ? 'Unpin' : 'Pin'}">${pinSvg}</button>
                                <button class="icon-btn delete-btn" onclick="deleteLink(${index})" title="Delete">${trashSvg}</button>
                            </div>
                            <span class="timer">${item.pinned ? 'Sticky' : '~' + timeLeft + 'm'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        } catch (error) {
            document.getElementById('linkContainer').innerHTML = "<span style='color: var(--danger);'>Error syncing with cloud.</span>";
        }
    }

    async function accessLockedLink(url) {
        const enteredPin = prompt("Enter the 3-digit PIN to open this link:");
        if (!enteredPin) return;
        
        try {
            let response = await fetch(API_URL, { headers: { "X-Master-Key": MASTER_KEY } });
            let data = await response.json();
            let links = data.record.links || [];
            
            let target = links.find(l => l.url === url);
            if (target && target.pin === enteredPin) {
                window.open(target.url, '_blank');
            } else {
                alert("Incorrect PIN!");
            }
        } catch (e) {
            alert("Verification failed.");
        }
    }

    async function saveLink() {
        const input = document.getElementById('urlInput');
        const pinInput = document.getElementById('pinInput');
        const pinCheck = document.getElementById('pinCheck');

        let url = input.value.trim();
        let pin = pinInput.value.trim();
        let isPinned = pinCheck.checked;

        if (!url) return;

        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            url = 'https://' + url;
        }

        if (pin && pin.length !== 3) {
            alert("PIN must be exactly 3 digits if provided.");
            return;
        }

        try {
            let response = await fetch(API_URL, {
                headers: { "X-Master-Key": MASTER_KEY }
            });
            let data = await response.json();
            let links = data.record.links || [];

            links.unshift({ 
                url: url, 
                timestamp: Date.now(), 
                pin: pin || null, 
                pinned: isPinned 
            });

            await fetch(API_URL, {
                method: 'PUT',
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": MASTER_KEY
                },
                body: JSON.stringify({ links: links })
            });

            input.value = '';
            pinInput.value = '';
            pinCheck.checked = false;
            fetchLinks();
        } catch (error) {
            alert("Failed to save link to cloud.");
        }
    }

    async function togglePin(index) {
        try {
            let response = await fetch(API_URL, { headers: { "X-Master-Key": MASTER_KEY } });
            let data = await response.json();
            let links = data.record.links || [];

            const now = Date.now();
            let activeLinks = links.filter(item => item.pinned || (now - item.timestamp) < EXPIRATION_TIME);
            activeLinks.sort((a, b) => (b.pinned === true) - (a.pinned === true) || b.timestamp - a.timestamp);

            let targetItem = activeLinks[index];
            let realIndex = links.findIndex(l => l.url === targetItem.url && l.timestamp === targetItem.timestamp);

            if (realIndex !== -1) {
                links[realIndex].pinned = !links[realIndex].pinned;
                await updateCloud(links);
            }
        } catch (e) {
            alert("Could not update pin status.");
        }
    }

    async function deleteLink(index) {
        try {
            let response = await fetch(API_URL, { headers: { "X-Master-Key": MASTER_KEY } });
            let data = await response.json();
            let links = data.record.links || [];

            const now = Date.now();
            let activeLinks = links.filter(item => item.pinned || (now - item.timestamp) < EXPIRATION_TIME);
            activeLinks.sort((a, b) => (b.pinned === true) - (a.pinned === true) || b.timestamp - a.timestamp);

            let targetItem = activeLinks[index];
            let realIndex = links.findIndex(l => l.url === targetItem.url && l.timestamp === targetItem.timestamp);

            if (realIndex !== -1) {
                links.splice(realIndex, 1);
                await updateCloud(links);
            }
        } catch (e) {
            alert("Could not delete link.");
        }
    }

    async function updateCloud(links) {
        await fetch(API_URL, {
            method: 'PUT',
            headers: {
                "Content-Type": "application/json",
                "X-Master-Key": MASTER_KEY
            },
            body: JSON.stringify({ links: links })
        });
        fetchLinks();
    }

    fetchLinks();
    setInterval(fetchLinks, 10000);
</script>

</body>
</html>
